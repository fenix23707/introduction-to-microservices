rootProject.name = 'microservices'

def modules = [
    'resource-service',
    'song-service',
    'service-registry',
    'resource-processor',
    'e2e-tests',
    'api-gateway',
    'configuration-service',
    'storage-service',
    'libs:observability'
]

modules.each { moduleName ->
    if (file(moduleName).exists()) {
        include(moduleName)
    }
}
