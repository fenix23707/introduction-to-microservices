server:
  port: 9080

eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
  client:
    registry-fetch-interval-seconds: 5
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

spring:
  application:
    name: gateway-service
  config:
    import:
      - "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
      - "optional:file:.env[.properties]"
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: songModule
              uri: ${SONG_SERVICE_URI:http://localhost:${SONG_SERVICE_PORT:8081}}
              predicates:
                - Path=/songs/**
            - id: resourceService
              uri: ${RESOURCE_SERVICE_URI:http://localhost:${RESOURCE_SERVICE_PORT:8080}}
              predicates:
                - Path=/resources/**