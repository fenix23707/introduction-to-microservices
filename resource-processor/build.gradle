apply plugin: 'org.springframework.boot'

dependencies {
    implementation ('org.springframework.boot:spring-boot-starter-web')
    implementation('org.springframework.boot:spring-boot-starter-kafka')
    implementation ('org.springframework.boot:spring-boot-starter-restclient')
    implementation('org.springframework.cloud:spring-cloud-starter-netflix-eureka-client')
    implementation('org.springframework.boot:spring-boot-starter-actuator')
    implementation('org.springframework.boot:spring-boot-starter-opentelemetry')
    implementation("io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:${opentelemetry_logback_appender_version}")

    implementation("org.apache.tika:tika-core:${apache_tika_version}")
    implementation("org.apache.tika:tika-parsers:${apache_tika_version}")
    implementation("org.apache.tika:tika-parsers-standard-package:${apache_tika_version}")
}
