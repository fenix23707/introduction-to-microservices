spring:
  application:
    name: resource-processor
  config:
    import:
      - optional:file:.env[.properties]

  http:
    client:
      service:
        group:
          song:
            base-url: http://song-service
          resource:
            base-url: http://resource-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.epam.*"
        spring.json.value.default.type: com.epam.common.dto.kafka.ResourceUploadEvent
        spring.json.use.type.headers: false
    listener:
      ack-mode: RECORD
eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
  client:
    registry-fetch-interval-seconds: 5
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

application:
  kafka:
    topic:
      song:
        name: ${KAFKA_TOPIC_SONG_NAME}

logging:
  level:
    org.springframework.retry: DEBUG
    org.springframework.core.retry: DEBUG
    org.springframework.resilience: TRACE
    org.springframework.kafka: DEBUG