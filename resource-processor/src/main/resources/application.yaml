server:
  port: 8087
spring:
  application:
    name: resource-processor
  config:
    import:
      - optional:file:.env[.properties]

  http:
    client:
      service:
        group:
          song:
            base-url: http://song-service
          resource:
            base-url: http://resource-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.epam.*"
        spring.json.value.default.type: com.epam.common.dto.kafka.ResourceUploadEvent
        spring.json.use.type.headers: false
    template:
      observation-enabled: true
    listener:
      ack-mode: RECORD
      observation-enabled: true
eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
  client:
    registry-fetch-interval-seconds: 5
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

application:
  kafka:
    topic:
      song:
        name: ${KAFKA_TOPIC_SONG_NAME:songs}
      song-created:
        name: ${KAFKA_TOPIC_SONG_CREATED_NAME:song-created}

logging:
  level:
    org.springframework.retry: DEBUG
    org.springframework.core.retry: DEBUG
    org.springframework.resilience: TRACE
    org.springframework.kafka: DEBUG
    io.opentelemetry.exporter: DEBUG
    io.opentelemetry.sdk.logs: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: ${GRAFANA_URL:http://localhost:4318}/v1/logs
    tracing:
      export:
        otlp:
          endpoint: ${GRAFANA_URL:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        url: ${GRAFANA_URL:http://localhost:4318}/v1/metrics