services:
  resource-service:
    build:
      context: .
      dockerfile: resource-service/Dockerfile
    environment:
      RESOURCE_POSTGRES_HOST: postgres-resource
      RESOURCE_POSTGRES_PORT: 5432
      RESOURCE_POSTGRES_DB: ${RESOURCE_POSTGRES_DB}
      RESOURCE_POSTGRES_USER: ${RESOURCE_POSTGRES_USER}
      RESOURCE_POSTGRES_PASSWORD: ${RESOURCE_POSTGRES_PASSWORD}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

      RESOURCE_SERVICE_AWS_S3_ENDPOINT: http://localstack:4566
      RESOURCE_SERVICE_AWS_S3_BUCKET_NAME: ${RESOURCE_SERVICE_AWS_S3_BUCKET_NAME}
      RESOURCE_SERVICE_AWS_S3_ACCESS_KEY: ${RESOURCE_SERVICE_AWS_S3_ACCESS_KEY}
      RESOURCE_SERVICE_AWS_S3_SECRET_KEY: ${RESOURCE_SERVICE_AWS_S3_SECRET_KEY}
      RESOURCE_SERVICE_AWS_S3_REGION: ${RESOURCE_SERVICE_AWS_S3_REGION}

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_SONG_NAME: ${KAFKA_TOPIC_SONG_NAME}
    ports:
      - ${RESOURCE_SERVICE_PORT}:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${RESOURCE_SERVICE_PORT}/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    depends_on:
      postgres-resource:
        condition: service_healthy
      localstack:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  postgres-resource:
    image: "postgres:18.3-alpine"
    ports:
      - ${RESOURCE_POSTGRES_PORT}:5432

    environment:
      POSTGRES_USER: ${RESOURCE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RESOURCE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RESOURCE_POSTGRES_DB}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./init-scripts/resource-db/:/docker-entrypoint-initdb.d/
#      - ./resource-db-data/:/var/lib/postgresql

  localstack:
    image: localstack/localstack:community-archive
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: ${RESOURCE_SERVICE_AWS_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RESOURCE_SERVICE_AWS_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${RESOURCE_SERVICE_AWS_S3_REGION}
      RESOURCE_SERVICE_AWS_S3_BUCKET_NAME: ${RESOURCE_SERVICE_AWS_S3_BUCKET_NAME}
    healthcheck:
      test: [ "CMD", "awslocal", "s3api", "wait", "bucket-exists", "--bucket", "${RESOURCE_SERVICE_AWS_S3_BUCKET_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
#      - ./localstack_data:/var/lib/localstack
      - ./init-scripts/localstack:/etc/localstack/init/ready.d

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092" ]
      interval: 30s
      retries: 5
      timeout: 10s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - 9088:8080
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  song-service:
    build:
      context: .
      dockerfile: song-service/Dockerfile
    environment:
      SONG_POSTGRES_HOST: postgres-song
      SONG_POSTGRES_PORT: 5432
      SONG_POSTGRES_DB: ${SONG_POSTGRES_DB}
      SONG_POSTGRES_USER: ${SONG_POSTGRES_USER}
      SONG_POSTGRES_PASSWORD: ${SONG_POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    deploy:
      replicas: 2

    ports:
      - 8082-8083:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    depends_on:
      postgres-song:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  postgres-song:
    image: "postgres:18.3-alpine"
    ports:
      - ${SONG_POSTGRES_PORT}:5432

    environment:
      POSTGRES_USER: ${SONG_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SONG_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SONG_POSTGRES_DB}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./init-scripts/song-db/:/docker-entrypoint-initdb.d/
#      - ./song-db-data/:/var/lib/postgresql

  resource-processor:
    build:
      context: .
      dockerfile: resource-processor/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_SONG_NAME: ${KAFKA_TOPIC_SONG_NAME}
    ports:
      - ${RESOURCE_PROCESSOR_PORT}:8080
    depends_on:
      song-service:
        condition: service_healthy
      resource-service:
        condition: service_healthy
      kafka:
        condition: service_healthy

  service-registry:
    build:
      context: .
      dockerfile: service-registry/Dockerfile
    ports:
      - 8761:8761
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

    ports:
      - 9080:9080
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9080/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    depends_on:
      song-service:
        condition: service_healthy
      resource-service:
        condition: service_healthy
      config-server:
        condition: service_healthy

  config-server:
    build:
      context: .
      dockerfile: configuration-service/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      CONFIG_SERVER_GIT_URI: ${CONFIG_SERVER_GIT_URI}

    ports:
      - 8888:8888
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    depends_on:
      service-registry:
        condition: service_healthy
